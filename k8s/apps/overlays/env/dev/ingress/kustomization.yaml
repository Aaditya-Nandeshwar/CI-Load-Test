apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This field tells Kustomize to apply these comman labels
labels:
- includeSelectors: true
  pairs:
    env: dev

#Reference to base folder
resources:
- ../../../../base/ingress

# This field tells Kustomize to apply this namespace to all resources
namespace: dev

patches:
- patch: |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: echo-ingress
    spec:
      rules:
      - http:
          paths:
          - pathType: Prefix
            path: /bar
            backend:
              service:
                name: bar-echo
                port:
                  number: 80
          - pathType: Prefix
            path: /foo
            backend:
              service:
                name: foo-echo
                port:
                  number: 80
